[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-hybrid-rag"
version = "0.2.0"
description = "TraceRAG: bounded agentic retrieval with auditable decisions and citations"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
models = ["sentence-transformers>=3.0", "faiss-cpu>=1.8"]
langchain = ["langchain-core>=0.3", "langchain-ollama>=0.2"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8.0"]

[project.scripts]
hybrid-rag = "hybrid_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
