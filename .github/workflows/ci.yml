name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install offline test dependencies
        run: python -m pip install -e ".[api,dev]"
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Run tests
        run: python -m pytest -q
      - name: Run fixed-vs-Agent behavior evaluation
        run: hybrid-rag evaluate --compare-fixed --embedding hashing --output data/evaluation/results_agent_comparison.json
